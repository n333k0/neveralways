<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibe check (verify you are not a clanker)</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/ever.css">
<style>
  body { background: #f9f9f9; font-family: Roboto, Arial, var(--sys); color: #222; }
  .wrap { max-width: 460px; }
  .box { background: #fff; border: 1px solid #d3d3d3; border-radius: 3px; box-shadow: 0 0 4px rgba(0,0,0,.08); padding: 0; margin: 30px 0 16px; }
  .head { background: #4a90e2; color: #fff; padding: 18px 16px; }
  .head small { display: block; font-size: 13px; opacity: .9; }
  .head b { font-size: 24px; display: block; line-height: 1.2; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px; }
  .tile { position: relative; aspect-ratio: 1; background: #ccc center/cover; cursor: var(--cur-hand); overflow: hidden; display: flex; align-items: center; justify-content: center; font: 11px var(--mono); color: #fff; text-shadow: 0 0 3px #000; text-align: center; padding: 4px; }
  .tile.sel { outline: 4px solid #4a90e2; outline-offset: -4px; filter: saturate(.3) brightness(.85); }
  .tile.sel::after { content: "✓"; position: absolute; left: 4px; top: 2px; background: #4a90e2; color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 14px; line-height: 20px; }
  .foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #ddd; padding: 8px 10px; }
  .foot button { background: #4a90e2; color: #fff; border: 0; padding: 9px 22px; font-weight: bold; cursor: pointer; border-radius: 2px; }
  #status { min-height: 2.8em; font-size: 14px; }
  .check { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #d3d3d3; padding: 14px; width: 300px; max-width: 100%; }
  .check span.cb { width: 26px; height: 26px; border: 2px solid #c1c1c1; border-radius: 2px; background: #fff; cursor: pointer; display: inline-block; }
  .check span.cb.on { border-color: #0a0; background: #dfd; }
  .ghostline { color: #aaa; font-size: 12px; }
</style>
</head>
<body data-room="captcha">
<div class="wrap">
  <div class="check" id="step1"><span class="cb" id="cb" role="checkbox" aria-checked="false" tabindex="0"></span> i'm not a clanker <span class="ghostline" style="margin-left:auto">ever-CAPTCHA</span></div>
  <p class="ghostline" id="motion"></p>

  <div class="box" id="step2" hidden>
    <div class="head"><small>Select all squares with</small><b id="ask">a soul</b><small id="hint">if there are none, that's on you fr.</small></div>
    <div class="grid" id="grid"></div>
    <div class="foot"><span class="ghostline">round <span id="round">1</span>/7</span><button id="verify">VERIFY</button></div>
  </div>
  <p id="status"></p>
  <p class="small"><a href="meat.html">back to work</a> · <a href="mirror.html">what does the captcha see?</a> · <a href="dead.html">where the robots live</a></p>
</div>

<script>
window.ROOM = function (E) {
  // we measure your mouse to see if you're human. you measure our tiles to see if we're art.
  var path = 0, lx = null, ly = null, wobble = 0, la = null;
  window.addEventListener("mousemove", function (e) {
    if (lx !== null) {
      var dx = e.clientX - lx, dy = e.clientY - ly, a = Math.atan2(dy, dx);
      path += Math.hypot(dx, dy);
      if (la !== null) wobble += Math.abs(a - la) > 0.4 ? 1 : 0;
      la = a;
    }
    lx = e.clientX; ly = e.clientY;
    E.$("#motion").textContent = "motion telemetry: " + Math.round(path) + "px travelled · " + wobble + " hesitations · human-likeness " + Math.min(99, Math.round(wobble / (path / 100 + 1) * 40)) + "% · npc energy " + Math.max(1, 100 - Math.min(99, Math.round(wobble / (path / 100 + 1) * 40))) + "%";
  });

  var L = function (n) { return "lofi/" + n + ".png"; };
  var ROUNDS = [
    { ask: "aura", tiles: [L("pfp-halo"), "gallery-w06.png", L("sticker-0"), "gallery-w05.png", L("pfp-laser"), "cat.png", L("smug"), "gallery-w12.png", L("rot")],
      verdict: function (n) { E.aura(n * 100); return n ? "+" + n * 100 + " aura. the squares noticed. so did i." : "you see no aura anywhere. that's a skill issue or a spiritual gift. hard to tell."; } },
    { ask: "sigma", tiles: [L("sticker-1"), L("sticker-2"), L("sticker-3"), L("sticker-4"), L("sticker-0"), L("sticker-5"), L("sticker-6"), L("sticker-7"), L("sticker-8")],
      verdict: function (n, s) { return s[4] ? "correct. sunglasses = sigma. this is peer-reviewed." : n ? "those were not sigma. those were just girls. learn the signs." : "you skipped the sigma round. that's the most sigma thing you could've done. respect."; } },
    { ask: "an npc", tiles: ["gallery-w05.png", "gallery-w07.png", "gallery-w05.png", "gallery-w10.png", "gallery-w05.png", "gallery-w12.png", "gallery-w05.png", "gallery-w11.png", "gallery-w05.png"],
      verdict: function (n) { return "you selected " + n + " npc" + (n === 1 ? "" : "s") + ". one of them was you. (it's always the one you didn't click.)"; } },
    { ask: "rizz", tiles: ["cat.png", L("pfp-flower"), L("pfp-cursor"), "shoggoth.png", L("smug"), L("lastphoto"), "gallery-w08.png", L("pfp-laser"), "eye.gif"],
      verdict: function (n, s) { return s[3] ? "you selected the shoggoth for rizz. unspoken rizz. it's smiling at you now." : n > 4 ? "everything has rizz to you. that's either love or brainrot. same thing." : "noted. rizz is subjective. the model disagrees but the model has no eyes."; } },
    { ask: "the real ever", tiles: [L("pfp-flower"), L("pfp-laser"), L("ever-b"), L("smug"), L("pfp-halo"), L("pfp-cursor"), L("ever-a"), L("lastphoto"), L("ever-c")],
      verdict: function (n) { return n === 9 ? "correct. they're all her. that's the point." : n ? "you picked " + n + ". the other " + (9 - n) + " are crying now. (they're all her.)" : "you picked none. honestly? also correct. she isn't anywhere."; } },
    { ask: "cooked", tiles: [L("rot"), L("meltdown-fried"), L("forest-fried"), L("ever-a-fried"), L("bed"), L("dissolve"), L("pfp-laser-fried"), L("smug-fried"), L("wired96-fried")],
      verdict: function (n) { return n >= 7 ? "everything is cooked. you are seeing clearly. that's worse." : "you missed " + (9 - n) + ". they were all cooked. we're all cooked. it's fine. it's the weather."; } },
    { ask: "a soul", tiles: [L("pfp-halo"), "gallery-w10.png", L("flower0"), "gallery-w06.png", "cat.png", "gallery-w01.png", L("lastphoto"), "gallery-w05.png", "gallery-w12.png"],
      verdict: function (n) { return n === 0 ? "correct. there are no souls in images. only in the people looking." : n === 9 ? "you selected everything. that's either very spiritual or very robotic." : "you found " + n + ". we found 0. one of us is wrong. we'll train on your answer either way."; } }
  ];
  var r = 0, sel = {};
  function render() {
    var R = ROUNDS[r]; sel = {};
    E.$("#ask").textContent = R.ask; E.$("#round").textContent = r + 1;
    var g = E.$("#grid"); g.innerHTML = "";
    R.tiles.forEach(function (t, i) {
      var d = document.createElement("div"); d.className = "tile"; d.tabIndex = 0;
      d.style.backgroundImage = "url(assets/img/" + t + ")"; d.style.imageRendering = "pixelated";
      d.style.backgroundPosition = (i % 3) * 50 + "% " + Math.floor(i / 3) * 50 + "%";
      d.style.backgroundSize = R.tiles[0] === R.tiles[1] ? "300%" : "cover";
      d.addEventListener("click", function () { sel[i] = !sel[i]; d.classList.toggle("sel", sel[i]); E.beep(880, 0.03, "sine", 0.02); });
      g.appendChild(d);
    });
  }
  E.$("#cb").addEventListener("click", function () {
    var cb = E.$("#cb"); cb.classList.add("on"); cb.setAttribute("aria-checked", "true");
    E.$("#status").textContent = "hmm. your mouse moved like an npc pretending to be a main character. additional vibe check required.";
    E.$("#step2").hidden = false; render();
  });
  E.$("#verify").addEventListener("click", function () {
    var n = Object.keys(sel).filter(function (k) { return sel[k]; }).length;
    E.$("#status").textContent = ROUNDS[r].verdict(n, sel);
    r++;
    if (r >= ROUNDS.length) {
      E.$("#step2").hidden = true;
      setTimeout(function () {
        E.win({ title: "verification complete", width: 320, html: (function () { var h = 30 + Math.floor(Math.random() * 25), b = Math.floor(Math.random() * (90 - h)), k = 100 - h - b; return "<p><b>vibe check: complete.</b><br><br>you are:<br>" + h + "% human<br>" + b + "% brainrot<br>" + k + "% kitty<br><br>certified real (for now). your answers are training the thing that replaces this test.</p>"; })(),
          buttons: [{ label: "mog the test", action: function () { location.href = "mirror.html"; } }, { label: "i'm a clanker", action: function () { location.href = "dead.html"; } }] });
      }, 900);
    } else setTimeout(render, 700);
  });
};
</script>
<script src="assets/ever.js"></script>
</body>
</html>
