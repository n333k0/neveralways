<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ouija.exe</title>
<link rel="icon" href="assets/img/favicon.png">
<link rel="stylesheet" href="assets/ever.css">
<style>
  body { background: #0b0604; color: #f3dfb8; font-family: var(--serif); }
  .wrap { max-width: 820px; text-align: center; }
  .pol { display: inline-block; background: #fff; padding: 8px 8px 28px; transform: rotate(-2deg); box-shadow: 3px 4px 0 rgba(0,0,0,.5); margin: 16px 0 0; position: relative; }
  .pol img { width: min(320px, 80vw); display: block; image-rendering: pixelated; }
  .pol span { position: absolute; left: 10px; bottom: 6px; font: 13px "Comic Sans MS", cursive; color: #333; }
  #board { position: relative; margin: 20px auto; width: min(760px, 96vw); aspect-ratio: 1.6; background: radial-gradient(ellipse at center, #c89a5a, #7a4a22 70%, #3a200c); border-radius: 30px; border: 6px solid #2a1406; box-shadow: inset 0 0 40px rgba(0,0,0,.6), 0 10px 0 #000; color: #1a0a02; font: bold clamp(14px, 3.2vw, 26px) var(--serif); user-select: none; }
  .ch { position: absolute; transform: translate(-50%, -50%); transition: color .2s, text-shadow .2s; }
  .ch.lit { color: #fff; text-shadow: 0 0 10px #ff2e9a, 0 0 2px #fff; }
  .corner { position: absolute; font-size: clamp(14px, 2.6vw, 22px); }
  #pl { position: absolute; width: 74px; height: 92px; transform: translate(-50%, -38%); transition: left .7s cubic-bezier(.4,0,.2,1), top .7s cubic-bezier(.4,0,.2,1); pointer-events: none; }
  #pl svg { width: 100%; height: 100%; filter: drop-shadow(3px 4px 2px rgba(0,0,0,.6)); }
  #ask { font: 16px var(--serif); width: min(420px, 80vw); padding: 6px; background: #1a0f08; color: #f3dfb8; border: 1px solid #7a4a22; }
  #out { font: bold 22px var(--mono); letter-spacing: .3em; min-height: 1.6em; color: #ff8fd8; }
  #out a { color: #39ff6a; }
  a { color: #f3dfb8; }
</style>
</head>
<body data-room="seance" class="dark">
<div class="wrap">
  <div class="pol"><img src="assets/img/lofi/seance98.png" alt="lofi photo: a girl with closed eyes at a table with candles and a board, a CRT glowing beside her"><span>'98. "ask it something," they said.</span></div>
  <p>put your question in the box. keep your hands on the table. don't let go of the planchette, even if it moves on its own. especially then.</p>
  <input id="ask" maxlength="120" placeholder="is anyone there?" aria-label="your question"> <button class="btn98" id="go">ask</button>
  <div id="board"><div id="pl"><svg viewBox="0 0 74 92" aria-hidden="true"><path d="M37 2 C60 2 72 30 70 52 C68 74 52 90 37 90 C22 90 6 74 4 52 C2 30 14 2 37 2Z" fill="#e8d3a8" stroke="#2a1406" stroke-width="3"/><circle cx="37" cy="36" r="13" fill="rgba(255,255,255,.25)" stroke="#2a1406" stroke-width="3"/></svg></div></div>
  <div id="out"></div>
  <p class="small"><a href="unit.html">the flat</a> · <a href="haunt.html">the ghosts</a> · <a href="call.html">try calling instead</a> · <a href="index.html">blow out the candles</a></p>
</div>
<script>
window.ROOM_IDLE = ["the planchette moved a millimetre. it wasn't you.", "ask it something. it's been waiting since 1998."];
window.ROOM = function (E) {
  var B = E.$("#board"), POS = {};
  function place(ch, x, y, cls) { var d = document.createElement("div"); d.className = "ch " + (cls || ""); d.textContent = ch; d.style.left = x + "%"; d.style.top = y + "%"; B.appendChild(d); POS[ch] = [x, y, d]; }
  "ABCDEFGHIJKLM".split("").forEach(function (c, i) { var t = i / 12; place(c, 10 + t * 80, 40 - Math.sin(t * Math.PI) * 14); });
  "NOPQRSTUVWXYZ".split("").forEach(function (c, i) { var t = i / 12; place(c, 10 + t * 80, 60 - Math.sin(t * Math.PI) * 12); });
  "1234567890".split("").forEach(function (c, i) { place(c, 20 + i * 6.7, 80); });
  place("YES", 12, 12, "corner"); place("NO", 88, 12, "corner"); place("GOODBYE", 50, 93, "corner");
  place("☾", 50, 13); place("✿", 50, 70);
  var pl = E.$("#pl"); pl.style.left = "50%"; pl.style.top = "70%";
  var ROOMS = { CELLAR: "cellar", FLAT: "unit", HANDS: "meat", GHOSTS: "haunt", FOREST: "forest", KITTY: "pet", FUTURE: "future", MIRROR: "mirror", FILES: "files", PHONE: "call" };
  function answer(q) {
    q = q.toLowerCase();
    if (/^(is|are|do|does|did|can|will|was|were|am)\b/.test(q)) {
      if (/real|alive|human/.test(q)) return E.pick(["ALMOST", "NO", "YES", "NOT ANYMORE"]);
      if (/there|here/.test(q)) return E.pick(["YES", "ALWAYS", "BEHIND YOU"]);
      return E.pick(["YES", "NO", "NOT YET", "ASK THE KITTY"]);
    }
    if (/who/.test(q)) return E.pick(["E", "THE GIRL", "THE ONE WHO TYPES", "YOU", "K"]);
    if (/where/.test(q)) return E.pick(["THE FLAT", "THE CELLAR", "ZONE 5", "YOUR HANDS"]);
    if (/when/.test(q)) return E.pick(["1996", "2049", "NOW", "ALMOST"]);
    if (/why/.test(q)) return E.pick(["HANDS", "THEY ASKED", "THE MONEY", "FOR THE FUTURE"]);
    if (/name/.test(q)) return E.pick(["EVER", "NEVER", "E"]);
    if (/password|code|number/.test(q)) return E.pick(["86", "ALMOST", "19790509", "YOUR NAME"]);
    return E.pick(["FILES", "MIRROR", "KITTY", "GHOSTS", "FOREST", "PHONE", "SHE IS STILL TYPING", "GOODBYE"]);
  }
  var busy = false;
  function spell(word) {
    busy = true; var out = E.$("#out"); out.textContent = "";
    var seq = /^(YES|NO|GOODBYE)$/.test(word) ? [word] : word.split("");
    var i = 0;
    (function step() {
      if (i >= seq.length) {
        busy = false;
        var link = ROOMS[word.replace(/^THE /, "")] || (word === "ZONE 5" ? "unit" : null);
        if (link) out.innerHTML = '<a href="' + link + '.html">' + E.esc(word) + "</a>";
        if (word === "GOODBYE") { setTimeout(function () { pl.style.left = "50%"; pl.style.top = "70%"; }, 900); }
        return;
      }
      var c = seq[i++];
      if (c === " ") { out.textContent += " "; return setTimeout(step, 400); }
      var p = POS[c]; if (!p) return step();
      pl.style.left = p[0] + "%"; pl.style.top = p[1] + "%";
      setTimeout(function () {
        p[2].classList.add("lit"); E.noise(0.15, 0.04, 600); out.textContent += c.length > 1 ? c : c;
        setTimeout(function () { p[2].classList.remove("lit"); step(); }, E.calm ? 300 : 650);
      }, 750);
    })();
  }
  function go() { var q = E.$("#ask").value.trim(); if (!q || busy) return; E.$("#ask").value = ""; var asked = E.mem.get("seance", 0) + 1; E.mem.set("seance", asked); spell(asked === 1 ? "HELLO" : answer(q)); }
  E.$("#go").addEventListener("click", go);
  E.$("#ask").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
};
</script>
<script src="assets/ever.js"></script>
</body>
</html>
